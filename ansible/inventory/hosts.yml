---
# Inventário estático para rodar o Ansible da SUA máquina (ex: --check --diff
# depois de mudar uma role). O pipeline não usa este arquivo: o Jenkins gera
# o inventory/hosts.ini na hora, com o IP e a chave dele.
all:
  children:
    # Servidores de jogos (Project Zomboid B42 em Docker, depois outros jogos).
    # Playbook: playbooks/gameserver.yml
    gameservers:
      hosts:
        gameserver:
          # Preencher com o IP real: `terraform output -raw gameserver_ip_address`
          # (ou o IP fixo definido em gameserver_ip_address). Sem ansible_host,
          # o Ansible tenta resolver o nome "gameserver" via DNS.
          # ansible_host: 192.168.31.X
      vars:
        ansible_user: mvrc
        # Sua chave pessoal (a pública vai para o mvrc via cloud-init)
        ansible_ssh_private_key_file: ~/.ssh/mvrc-pc
        ansible_python_interpreter: /usr/bin/python3
