---
# Inventário estático. A VM de aplicação (grupo olvm_servers) continua com o
# inventário hosts.ini gerado na hora pelo Jenkins - nada dela é declarado aqui.
all:
  children:
    # Servidores de jogos (Project Zomboid B42 em Docker, depois outros jogos).
    # Ainda sem playbook.
    gameservers:
      hosts:
        gameserver:
          # Preencher com o IP real: `terraform output -raw gameserver_ip_address`
          # (ou o IP fixo definido em gameserver_ip_address). Sem ansible_host,
          # o Ansible tenta resolver o nome "gameserver" via DNS.
          # ansible_host: 192.168.31.X
      vars:
        ansible_user: mvrc
        ansible_ssh_private_key_file: /home/mvrc/.ssh/ansible_key
        ansible_python_interpreter: /usr/bin/python3
