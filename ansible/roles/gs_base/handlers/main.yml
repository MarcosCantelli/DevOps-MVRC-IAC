---
# Os dois handlers escutam o mesmo tópico e rodam na ordem em que estão
# definidos: se a validação da config completa falhar, o restart não acontece.
- name: Validar configuração completa do sshd
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  listen: Validar e reiniciar ssh

# Reiniciar o sshd não derruba sessões já abertas (inclusive a do Ansible).
- name: Reiniciar ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted
  listen: Validar e reiniciar ssh

- name: Reiniciar fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
