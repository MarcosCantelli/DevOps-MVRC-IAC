---
- name: Instalar rsync
  ansible.builtin.apt:
    name: rsync
    state: present

# Backups contêm o .ini com a senha do servidor: só root lê.
- name: Criar diretório de backups
  ansible.builtin.file:
    path: "{{ gs_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Instalar script de backup
  ansible.builtin.copy:
    src: zomboid-backup.sh
    dest: /usr/local/sbin/zomboid-backup
    owner: root
    group: root
    mode: "0750"

- name: Gerar configuração do backup
  ansible.builtin.template:
    src: zomboid-backup.env.j2
    dest: /etc/default/zomboid-backup
    owner: root
    group: root
    mode: "0600"

- name: Gerar unidades systemd do backup
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - zomboid-backup.service
    - zomboid-backup.timer
  notify: Recarregar systemd (backup)

- name: Aplicar daemon-reload antes de habilitar o timer
  ansible.builtin.meta: flush_handlers

- name: Habilitar e iniciar o timer diário de backup
  ansible.builtin.systemd_service:
    name: zomboid-backup.timer
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"
