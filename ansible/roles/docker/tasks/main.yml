---
# Instalação oficial do Docker CE no Ubuntu:
# https://docs.docker.com/engine/install/ubuntu/
- name: Remover pacotes que conflitam com o Docker CE
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - podman-docker
      - containerd
      - runc
    state: absent

- name: Garantir diretório de keyrings do apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Baixar chave GPG do repositório do Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

# Arquivo .sources (formato deb822) escrito direto, sem depender do
# python3-debian que o módulo deb822_repository exige no guest.
- name: Adicionar repositório oficial do Docker CE
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/docker.asc
  register: docker_repo

- name: Instalar Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: "{{ docker_repo is changed }}"

- name: Habilitar e iniciar o serviço Docker
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Adicionar usuário mvrc ao grupo docker
  ansible.builtin.user:
    name: mvrc
    groups: docker
    append: true

- name: Verificar instalação do Docker
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false

- name: Exibir versão do Docker instalado
  ansible.builtin.debug:
    msg: "{{ docker_version.stdout }}"
