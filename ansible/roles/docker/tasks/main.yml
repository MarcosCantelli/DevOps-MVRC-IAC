---
- name: Instalar dependências para o Docker
  dnf:
    name:
      - dnf-utils
    state: present

# Docker não publica repositório próprio para Oracle Linux, mas o OL9 é
# binário-compatível com RHEL/CentOS - o repo do CentOS é a rota
# documentada/usada na prática para instalar Docker CE em Oracle Linux.
- name: Adicionar repositório oficial do Docker CE (via repo CentOS, compatível com Oracle Linux)
  command: dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
  args:
    creates: /etc/yum.repos.d/docker-ce.repo

- name: Instalar Docker Engine
  dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Habilitar e iniciar o serviço Docker
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Adicionar usuário mvrc ao grupo docker
  user:
    name: mvrc
    groups: docker
    append: yes

- name: Verificar instalação do Docker
  command: docker --version
  register: docker_version
  changed_when: false

- name: Exibir versão do Docker instalado
  debug:
    msg: "{{ docker_version.stdout }}"
