---
# Provisiona a VM de servidores de jogos (Ubuntu, criada pelo Terraform em
# terraform/gameserver.tf). Roles com prefixo gs_ porque base/ e docker/ já
# existem para o Oracle Linux da VM de aplicação.
#
# Primeiro run (sempre em modo de simulação):
#   cd ansible
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory/hosts.yml playbooks/gameserver.yml \
#     --ask-vault-pass --check --diff
- name: Provisionar servidor de jogos (Project Zomboid B42 em Docker)
  hosts: gameservers
  become: true

  pre_tasks:
    - name: Aguardar SSH ficar disponível
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 180

    - name: Garantir que os segredos do Vault foram carregados
      ansible.builtin.assert:
        that:
          - tailscale_authkey | default('') | length > 0
          - zomboid_password | default('') | length > 0
          - zomboid_admin_password | default('') | length > 0
        fail_msg: >-
          Segredos ausentes. Crie inventory/group_vars/gameservers/vault.yml a
          partir do vault.example.yml, criptografe com ansible-vault e rode com
          --ask-vault-pass.
        quiet: true

  roles:
    - gs_base
    - gs_firewall
    - gs_tailscale
    - gs_docker
    - gs_zomboid
    - gs_backup
