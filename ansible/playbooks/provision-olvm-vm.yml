---
- name: Provisionar servidor de aplicação Docker no OLVM (Ubuntu)
  hosts: olvm_servers
  become: true
  vars:
    app_user: "mvrc"

  pre_tasks:
    - name: Aguardar SSH ficar disponível
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 180

    # No primeiro boot o cloud-init ainda pode estar rodando (usuário, DNS,
    # growpart) e o apt pode estar travado por ele - espera terminar.
    # rc 2 = terminou com avisos recuperáveis, não é falha.
    - name: Aguardar o cloud-init terminar o primeiro boot
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init_status
      changed_when: false
      failed_when: cloud_init_status.rc not in [0, 2]

    - name: Atualizar cache de pacotes (apt)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  roles:
    - swap
    - base
    - ufw
    - docker
    - traefik
