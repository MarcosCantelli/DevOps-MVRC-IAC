---
- name: Provisionar servidor de aplicação Docker no OLVM (Oracle Linux 9)
  hosts: olvm_servers
  become: true
  vars:
    app_user: "mvrc"

  pre_tasks:
    - name: Aguardar SSH ficar disponível
      wait_for_connection:
        delay: 10
        timeout: 180

    - name: Atualizar cache de pacotes (dnf)
      dnf:
        update_cache: yes

  roles:
    - swap
    - base
    - firewalld
    - docker
    - traefik
