---
# Coleções usadas pelas roles do gameserver (gs_*):
#   community.general -> módulo ufw
#   community.docker  -> docker_compose_v2 (idempotente e com suporte a --check)
# Instalar com: ansible-galaxy collection install -r requirements.yml
collections:
  - name: community.general
    version: ">=8.0.0"
  - name: community.docker
    version: ">=3.10.0"
